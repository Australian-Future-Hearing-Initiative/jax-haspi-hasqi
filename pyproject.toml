[project]
name = "jax-haspi-hasqi"
version = "0.0.1"
description = "HASPI v2 and HASQI v2 in JAX, faithful to pyclarity 0.9.0."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "third_party/pyclarity/LICENSE"]
dependencies = [
    "jax>=0.10.1,<0.11",
    "jaxlib>=0.10.1,<0.11",
    "numpy>=1.26",
    "scipy>=1.11",
]

# pyclarity is deliberately absent: it is needed only to regenerate goldens,
# which is a rare manual step run in a throwaway environment. See tools/.
[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.15.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jax_haspi_hasqi"]
# The goldens are the port's specification, so they ship with it: the loader
# reads them from inside the package and a wheel without them raises.
artifacts = ["src/jax_haspi_hasqi/_golden_data/*"]

[tool.ruff]
line-length = 80
indent-width = 2
target-version = "py311"

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "PLC", "PLE", "PLW", "RUF100"]
ignore = ["PLW0603", "PLW0120"]

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint.isort]
force-single-line = true
